name: Prod Deployment Workflow

# Deploys to production when a version tag is pushed to the repository.
# Tag format: v* (e.g. v1.0.0, v2.1.3)
#
# This decouples production deployments from main branch merges —
# multiple changes can accumulate on main before a deliberate production release.
# A release is made by pushing a tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod

    # Required for Databricks GitHub OIDC — GitHub issues an OIDC token that the
    # Databricks CLI exchanges for a short-lived access token automatically.
    # No client secret is stored or needed.

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy bundle to prod
        run: databricks bundle deploy --target prod
